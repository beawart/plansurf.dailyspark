<div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useMemo,useCallback}=React;
const TASK_KEY='daily-planner-v5-secure-backup';
const LEAVE_KEY='daily-planner-v5-leave';
const BACKUP_KEY='daily-planner-v5-last-json-backup';
const LAST_LEAVE_KEY='daily-planner-last-leave-defaults';
const AUTO_BACKUP_META_KEY='daily-planner-v5-auto-backup-meta';
const AUTO_BACKUP_DB='daily-planner-auto-backup-db';
const GITHUB_CONFIG='daily-planner-github-sync-v1';
const SYNC_BUILD='daily-planner-sync-2026-09-18-1';
const DEFAULT_SYNC_CONFIG={owner:'beawart',repo:'plansurf-data',path:'plansurf.daily-spark-data.json',branch:'main'};
const OLD_TASK_KEYS=['daily-planner-v2','daily-planner-v3','daily-planner-v4-weekend-leave','daily-planner-v4-weekend-leave-smarts','daily-planner-with-leave'];
const OLD_LEAVE_KEYS=['daily-planner-leave-v1','daily-planner-v4-leave'];
let MEM_TASKS={}, MEM_LEAVE=[], MEM_BACKUP=null, MEM_LAST=null;
const canStore=()=>{try{localStorage.setItem('__planner_test','1');localStorage.removeItem('__planner_test');return true}catch{return false}};
const HAS_STORAGE=canStore();
const getJSON=(k,fb)=>{try{return HAS_STORAGE?(JSON.parse(localStorage.getItem(k))??fb):fb}catch{return fb}};
const setJSON=(k,v)=>{try{if(HAS_STORAGE)localStorage.setItem(k,JSON.stringify(v))}catch{}};

const idbOpen=()=>new Promise((resolve,reject)=>{const req=indexedDB.open(AUTO_BACKUP_DB,1);req.onupgradeneeded=()=>req.result.createObjectStore('handles');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
const idbGet=async key=>{try{const db=await idbOpen();return await new Promise((resolve,reject)=>{const tx=db.transaction('handles','readonly');const req=tx.objectStore('handles').get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}catch{return null}};
const idbSet=async(key,val)=>{try{const db=await idbOpen();await new Promise((resolve,reject)=>{const tx=db.transaction('handles','readwrite');tx.objectStore('handles').put(val,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch{}};
const idbDel=async key=>{try{const db=await idbOpen();await new Promise((resolve,reject)=>{const tx=db.transaction('handles','readwrite');tx.objectStore('handles').delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch{}};
const fsAvailable=()=>!!(window.showDirectoryPicker&&window.indexedDB);
const verifyDir=async handle=>{if(!handle)return false;try{if((await handle.queryPermission({mode:'readwrite'}))==='granted')return true;return (await handle.requestPermission({mode:'readwrite'}))==='granted'}catch{return false}};
const writeBackupFile=async(handle,data)=>{const name='planner-latest-backup.json';const file=await handle.getFileHandle(name,{create:true});const w=await file.createWritable();await w.write(JSON.stringify(data,null,2));await w.close();return name};
const getBackupMeta=()=>getJSON(AUTO_BACKUP_META_KEY,{lastAutoBackup:null,lastFile:null,folderName:null});
const setBackupMeta=m=>setJSON(AUTO_BACKUP_META_KEY,m);
const getSyncConfig=()=>{const saved=getJSON(GITHUB_CONFIG,{});return{owner:saved.owner||DEFAULT_SYNC_CONFIG.owner,repo:saved.repo||DEFAULT_SYNC_CONFIG.repo,path:saved.path||DEFAULT_SYNC_CONFIG.path,branch:saved.branch||DEFAULT_SYNC_CONFIG.branch}};
const b64encode=s=>{const bytes=new TextEncoder().encode(s);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)};
const b64decode=s=>{const bin=atob(s.replace(/\n/g,'')),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)};
const githubError=x=>{try{const data=JSON.parse(x);if(data.message)return data.message}catch{}if(x.includes('401'))return'Token is invalid or expired.';if(x.includes('403'))return'Token lacks repository access.';if(x.includes('404'))return'Repository or planner file was not found.';if(x.includes('409'))return'The file changed elsewhere. Pull the latest copy first.';return x.slice(0,180)};

const mergeTasks=(a,b)=>{const m={...(a||{})}; Object.keys(b||{}).forEach(k=>{if(!Array.isArray(b[k]))return; const ids=new Set((m[k]||[]).map(t=>t.id)); m[k]=[...(m[k]||[])]; b[k].forEach(t=>{if(!ids.has(t.id)){m[k].push(t); ids.add(t.id)}})}); return m};
const mergeLeave=(a,b)=>{const ids=new Set((a||[]).map(r=>r.id)); return [...(a||[]),...(b||[]).filter(r=>r&&r.id&&!ids.has(r.id))]};
const migrateTasks=()=>{let data=getJSON(TASK_KEY,null); let migrated=false; if(!data){data={}; migrated=true} OLD_TASK_KEYS.forEach(k=>{const old=getJSON(k,null); if(old&&Object.keys(old).length){data=mergeTasks(data, old.tasks||old); migrated=true}}); if(migrated)setJSON(TASK_KEY,data); return data};
const migrateLeave=()=>{let data=getJSON(LEAVE_KEY,null); let migrated=false; if(!data){data=[]; migrated=true} OLD_LEAVE_KEYS.forEach(k=>{const old=getJSON(k,null); if(Array.isArray(old)&&old.length){data=mergeLeave(data, old); migrated=true}}); if(migrated)setJSON(LEAVE_KEY,data); return data};
const loadTasks=()=>HAS_STORAGE?migrateTasks():MEM_TASKS;
const saveTasks=d=>{MEM_TASKS=d;setJSON(TASK_KEY,d)};
const loadLeave=()=>HAS_STORAGE?migrateLeave():MEM_LEAVE;
const saveLeave=d=>{MEM_LEAVE=d;setJSON(LEAVE_KEY,d)};
const loadLastLeave=()=>HAS_STORAGE?getJSON(LAST_LEAVE_KEY,null):MEM_LAST;
const saveLastLeave=d=>{MEM_LAST=d;setJSON(LAST_LEAVE_KEY,d)};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dateKey(d)};
const isSame=(a,b)=>dateKey(a)===dateKey(b);
const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
const priorityOrder={high:0,medium:1,low:2};
const blockLabels={morning:'Morning',afternoon:'Afternoon',evening:'Evening',unscheduled:'Today’s Tasks'};

 useEffect(()=>{let host=document.getElementById('sync-modal-root');if(!host){host=document.createElement('div');host.id='sync-modal-root';document.body.appendChild(host)}if(!host._root)host._root=ReactDOM.createRoot(host);if(syncModal)host._root.render(<SyncModal config={syncConfig} token={githubToken} dirty={backupDirty} syncing={syncing} onClose={()=>setSyncModal(false)} onConfig={saveSyncConfig} onToken={setGithubToken} onPull={pullGitHub} onPush={pushGitHub} status={syncStatus}/>);else host._root.render(null)},[syncModal,syncConfig,githubToken,backupDirty,syncing,syncStatus]);

 const restoreLastBackup=()=>{const b=HAS_STORAGE?getJSON(BACKUP_KEY,null):MEM_BACKUP; if(!b)return alert('No local backup snapshot found.'); if(confirm('Restore the last local JSON backup snapshot into this planner?')){setAllTasks(p=>mergeTasks(p,b.tasks||{}));setLeaveRecords(p=>mergeLeave(p,b.leaveRecords||[]))}};
 const githubContentsUrl=config=>`https://api.github.com/repos/${encodeURIComponent(config.owner)}/${encodeURIComponent(config.repo)}/contents/${config.path.split('/').map(encodeURIComponent).join('/')}`;

 const setAutoBackupFolder=async()=>{if(!fsAvailable())return alert('Auto backup folders are not supported in this browser. Use Microsoft Edge/Chrome and choose a local or OneDrive-synced folder.'); try{const handle=await window.showDirectoryPicker({mode:'readwrite'}); if(!(await verifyDir(handle)))return alert('Folder permission was not granted.'); await idbSet('backupDirHandle',handle); const meta={...getBackupMeta(),folderName:handle.name}; setBackupMeta(meta); setAutoBackup(meta); const file=await writeBackupFile(handle,makeBackup()); const done={...meta,lastAutoBackup:new Date().toISOString(),lastFile:file}; setBackupMeta(done); setAutoBackup(done); setBackupDirty(false); alert(`Auto-backup folder set. Backup saved: ${file}`);}catch(e){if(e?.name!=='AbortError')alert('Could not set auto-backup folder.')}};
 const clearAutoBackupFolder=async()=>{await idbDel('backupDirHandle'); const meta={lastAutoBackup:null,lastFile:null,folderName:null}; setBackupMeta(meta); setAutoBackup(meta); alert('Auto-backup folder cleared.')};
 const runWeeklyAutoBackup=useCallback(async(force=false)=>{if(!fsAvailable())return; const handle=await idbGet('backupDirHandle'); if(!handle)return; if(!(await verifyDir(handle)))return; const meta=getBackupMeta(); const last=meta.lastAutoBackup?new Date(meta.lastAutoBackup):null; const due=!last || (Date.now()-last.getTime())>=7*24*60*60*1000; if(!force&&!due)return; try{const file=await writeBackupFile(handle,makeBackup()); const done={...meta,folderName:handle.name,lastAutoBackup:new Date().toISOString(),lastFile:file}; setBackupMeta(done); setAutoBackup(done); setBackupDirty(false);}catch{}}
 , [makeBackup]);

 // Back up 5 seconds after planner changes stop (debounced).

 // Also back up every 2 minutes while the planner remains open.
 useEffect(()=>{const timer=setInterval(()=>{runWeeklyAutoBackup(true)},2*60*1000);return()=>clearInterval(timer)},[runWeeklyAutoBackup]);

 // Browsers may not wait for asynchronous file writes during shutdown,
 // so the debounced and timed backups above remain the primary protection.
 useEffect(()=>{const handleClose=()=>{runWeeklyAutoBackup(true)};const handleVisibility=()=>{if(document.visibilityState==='hidden')handleClose()};window.addEventListener('beforeunload',handleClose);window.addEventListener('pagehide',handleClose);document.addEventListener('visibilitychange',handleVisibility);return()=>{window.removeEventListener('beforeunload',handleClose);window.removeEventListener('pagehide',handleClose);document.removeEventListener('visibilitychange',handleVisibility)}},[runWeeklyAutoBackup]);
 const leaveForDate=useCallback(k=>leaveRecords.find(r=>k>=r.start&&k<=r.end)||null,[leaveRecords]); const activeLeave=leaveForDate(sk);
 const isMonday=parseKey(sk).getDay()===1;
 const carryKeys=useMemo(()=>isMonday?allPreviousKeys(allTasks,sk):[prevBiz(sk)],[allTasks,sk,isMonday]);
 const carryItems=useMemo(()=>carryKeys.flatMap(k=>(allTasks[k]||[]).filter(t=>!t.completed&&!t.carriedForward&&!t.leaveDeferred&&!t.forwardedTo).map(t=>({task:t,key:k}))),[allTasks,carryKeys]);
 const forwardFromSources=(sourceKeys,targetKey,reason,leaveRecord=null)=>{let moved=0; setAllTasks(prev=>{const u={...prev}; const existing=new Set((u[targetKey]||[]).map(t=>`${t.carriedFrom||''}|${t.originalTaskId||t.id}|${t.leaveId||''}|${reason}`)); const carried=[]; sourceKeys.forEach(k=>(u[k]||[]).forEach(t=>{const orig=t.originalTaskId||t.id; const key=`${k}|${orig}|${leaveRecord?.id||''}|${reason}`; if(k!==targetKey&&!t.completed&&!existing.has(key)&&!t.forwardedTo){carried.push({...t,id:uid(),originalTaskId:orig,completed:false,completedAt:null,carriedFrom:k,leaveForwarded:!!leaveRecord,leaveType:leaveRecord?.type,leaveId:leaveRecord?.id,weekendForwarded:reason==='monday',outstandingForwarded:reason==='all'});}})); moved=carried.length; if(moved){sourceKeys.forEach(k=>{u[k]=(u[k]||[]).map(t=>carried.some(c=>c.carriedFrom===k&&c.originalTaskId===(t.originalTaskId||t.id))?{...t,carriedForward:reason==='monday'||reason==='daily'||reason==='all',leaveDeferred:!!leaveRecord,forwardedTo:targetKey,deferredTo:targetKey}:t)}); u[targetKey]=[...(u[targetKey]||[]),...carried];} return u}); return moved};
 const carryForward=()=>{const n=forwardFromSources(carryKeys,sk,isMonday?'monday':'daily'); setTimeout(()=>alert(n?`${n} task${n===1?'':'s'} forwarded to ${sk}.`:'No pending tasks found to forward.'),0)};
 const forwardAllOutstanding=()=>{const keys=allPreviousKeys(allTasks,sk); const n=forwardFromSources(keys,sk,'all'); setTimeout(()=>alert(n?`${n} outstanding task${n===1?'':'s'} forwarded to ${sk}.`:'No outstanding tasks found before this date.'),0)};
 const leaveSourceKeys=r=>[prevBiz(r.start),...dateRange(r.start,r.end)].filter((v,i,a)=>a.indexOf(v)===i);
 const leaveCount=r=>leaveSourceKeys(r).reduce((sum,k)=>sum+((allTasks[k]||[]).filter(t=>!t.completed&&!t.forwardedTo).length),0);
 const forwardLeave=r=>{const n=forwardFromSources(leaveSourceKeys(r),r.returnDate,'leave',r); setLeaveRecords(prev=>prev.map(x=>x.id===r.id?{...x,forwardedAt:Date.now(),forwardedCount:(x.forwardedCount||0)+n}:x)); setTimeout(()=>alert(n?`${n} task${n===1?'':'s'} forwarded to ${r.returnDate}.`:'No incomplete tasks found on the previous business day or leave dates, or they were already forwarded.'),0); return n};
 const addLeave=r=>{const rec={...r,id:uid(),createdAt:Date.now(),forwardedCount:0}; setLeaveRecords(prev=>[...prev,rec]); saveLastLeave({type:r.type,duration:dateRange(r.start,r.end).length}); forwardLeave(rec)};
 const removeLeave=id=>setLeaveRecords(prev=>prev.filter(r=>r.id!==id));
 const addTask=t=>setAllTasks(p=>({...p,[sk]:[...(p[sk]||[]),{...t,id:uid(),completed:false,createdAt:Date.now()}]}));
 const updateTask=(id,u)=>setAllTasks(p=>({...p,[sk]:(p[sk]||[]).map(t=>t.id===id?{...t,...u}:t)})); const delTask=id=>setAllTasks(p=>({...p,[sk]:(p[sk]||[]).filter(t=>t.id!==id)})); const toggle=id=>setAllTasks(p=>({...p,[sk]:(p[sk]||[]).map(t=>t.id===id?{...t,completed:!t.completed,completedAt:!t.completed?Date.now():null}:t)}));
 const filtered=useMemo(()=>{let t=dayTasks;if(search){const s=search.toLowerCase();t=t.filter(x=>x.title.toLowerCase().includes(s)||(x.notes||'').toLowerCase().includes(s))} if(fp!=='all')t=t.filter(x=>x.priority===fp); if(fs==='done')t=t.filter(x=>x.completed); if(fs==='todo')t=t.filter(x=>!x.completed); return t},[dayTasks,search,fp,fs]);
 const grouped=useMemo(()=>{const g={morning:[],afternoon:[],evening:[],unscheduled:[]};filtered.forEach(t=>g[getBlock(t.time)].push(t));Object.values(g).forEach(a=>a.sort((x,y)=>(priorityOrder[x.priority]??1)-(priorityOrder[y.priority]??1)));return g},[filtered]);
 const total=dayTasks.length, done=dayTasks.filter(t=>t.completed).length, pct=total?Math.round(done/total*100):0;
 const weekStats=useMemo(()=>{const d=new Date(selectedDate);d.setDate(d.getDate()-d.getDay());let total=0,done=0,carried=0;for(let i=0;i<7;i++){const x=new Date(d);x.setDate(x.getDate()+i);const arr=allTasks[dateKey(x)]||[];total+=arr.length;done+=arr.filter(t=>t.completed&&!t.carriedForward).length;carried+=arr.filter(t=>t.carriedFrom).length}return{total,done,carried,pct:total?Math.round(done/total*100):0}},[allTasks,sk]);
 const days=useMemo(()=>{const first=new Date(cy,cm,1),last=new Date(cy,cm+1,0),out=[];for(let i=first.getDay()-1;i>=0;i--)out.push({date:new Date(cy,cm,-i),other:true});for(let i=1;i<=last.getDate();i++)out.push({date:new Date(cy,cm,i),other:false});while(out.length%7)out.push({date:new Date(cy,cm+1,out.length%7),other:true});return out},[cm,cy]);
 const status=d=>{const k=dateKey(d);if(leaveForDate(k))return'leave';const arr=allTasks[k]||[];if(!arr.length)return'';const x=arr.filter(t=>t.completed).length;return x===arr.length?'done':x?'part':'todo'};
 const fmt=d=>{if(isSame(d,today))return'Today';const y=new Date(today);y.setDate(y.getDate()-1);if(isSame(d,y))return'Yesterday';const tm=new Date(today);tm.setDate(tm.getDate()+1);if(isSame(d,tm))return'Tomorrow';return`${dayNames[d.getDay()]}, ${monthNames[d.getMonth()]} ${d.getDate()}`};
 return <div><div className="header"><h1><span className="logo-bubble">✨</span> Daily Spark Planner <small>Plan it. Do it. Celebrate it.</small></h1><div className="tools"><button className="icon" title="Today" onClick={()=>{setSelectedDate(today);setCm(today.getMonth());setCy(today.getFullYear())}}>⌂</button><button className="icon" title="Record leave" onClick={()=>setLeaveModal(true)}>🏖</button><button className="icon" title="Forward all outstanding work to selected day" onClick={forwardAllOutstanding}>⏭</button><button className={'icon '+(dark?'active':'')} title="Dark mode" onClick={()=>setDark(!dark)}>{dark?'☀':'☾'}</button></div></div><div className="app"><aside className="side"><div className="cal-head"><button onClick={()=>cm===0?(setCm(11),setCy(cy-1)):setCm(cm-1)}>‹</button><b>{monthNames[cm]} {cy}</b><button onClick={()=>cm===11?(setCm(0),setCy(cy+1)):setCm(cm+1)}>›</button></div><div className="cal-grid">{dayNames.map(d=><div className="dow" key={d}>{d}</div>)}{days.map((cd,i)=>{const st=status(cd.date);return <button key={i} className={`day ${cd.other?'other':''} ${isSame(cd.date,today)?'today':''} ${isSame(cd.date,selectedDate)?'sel':''}`} onClick={()=>setSelectedDate(new Date(cd.date))}>{cd.date.getDate()}<span className="dots">{st&&<span className={`dot ${st}`}></span>}</span></button>})}</div><div className="search"><span>🔍</span><input placeholder="Search tasks..." value={search} onChange={e=>setSearch(e.target.value)}/></div><div className="card"><h3>This Week</h3><div className="stat"><span>Total tasks</span><b>{weekStats.total}</b></div><div className="stat"><span>Completed</span><b>{weekStats.done}</b></div><div className="stat"><span>Carried forward</span><b>{weekStats.carried}</b></div><div className="progress"><div className="bar" style={{width:`${weekStats.pct}%`}}></div></div><div className="stat"><span>Completion rate</span><b>{weekStats.pct}%</b></div></div><div className="card"><h3>Backup and migration</h3><div className="stat"><span>Old planner data</span><b>Auto-checked</b></div><div className="stat"><span>Auto backup folder</span><b>{autoBackup.folderName||'Not set'}</b></div><div className="stat"><span>Last auto backup</span><b>{autoBackup.lastAutoBackup?autoBackup.lastAutoBackup.slice(0,10):'Never'}</b></div><div className="io"><button onClick={setAutoBackupFolder}>Set auto folder</button><button onClick={()=>runWeeklyAutoBackup(true)}>Run auto backup</button><button onClick={clearAutoBackupFolder}>Clear folder</button><button onClick={importData}>Import</button></div></div></aside><main className="main"><div className="day-head"><div><h2>{fmt(selectedDate)}{activeLeave&&<span className="badge">{activeLeave.type==='sick'?'Sick leave':'Planned leave'}</span>}</h2><div className="sub">{monthNames[selectedDate.getMonth()]} {selectedDate.getDate()}, {selectedDate.getFullYear()}</div></div><div className="stats"><span>✓ {done}/{total}</span><span>{pct}%</span></div></div><div className="spark-banner"><div><span className="spark-emoji">{pct===100&&total?'🎉':total?'🚀':'🌈'}</span><div><strong>{pct===100&&total?'You crushed today!':total?'Small steps, big momentum!':'A fresh page is ready for you!'}</strong><small>{total?`${done} of ${total} tasks complete. Keep the spark going.`:'Add your first task and make today count.'}</small></div></div><div className="mini-progress"><span style={{width:`${pct}%`}}></span></div></div>{activeLeave&&<div className="banner info"><div><strong>{activeLeave.type==='sick'?'🤒 Sick leave':'🏖 Planned leave'} recorded</strong><small>Pending tasks from the previous business day plus leave dates forward to {activeLeave.returnDate}. {activeLeave.forwardedAt?`${activeLeave.forwardedCount||0} task${(activeLeave.forwardedCount||0)===1?'':'s'} forwarded.`:''}</small></div><div style={{display:'flex',gap:6}}><button onClick={()=>forwardLeave(activeLeave)}>Forward now</button><button onClick={()=>removeLeave(activeLeave.id)}>Remove</button></div></div>}{carryItems.length>0&&!activeLeave&&<div className="banner warn"><div><strong>⚠ {carryItems.length} pending task{carryItems.length===1?'':'s'} to carry forward</strong><small>{isMonday?'Monday logic: forwards all outstanding tasks from previous weeks/days into Monday.':'Forwarding pending tasks from the previous business day.'}</small></div><button onClick={carryForward}>Move to {isSame(selectedDate,today)?'Today':'This Day'}</button></div>}<CompactTaskAdd onAdd={addTask} onForwardAll={forwardAllOutstanding} done={done} total={total} pct={pct}/><div className="filters">{['all','high','medium','low'].map(x=><button className={`pill ${fp===x?'active':''}`} onClick={()=>setFp(x)} key={x}>{x==='all'?'All':x[0].toUpperCase()+x.slice(1)}</button>)}<span style={{width:1,background:'var(--border)',margin:'0 4px'}}></span>{['all','todo','done'].map(x=><button className={`pill ${fs===x?'active':''}`} onClick={()=>setFs(x)} key={x}>{x==='all'?'All':x==='todo'?'To Do':'Done'}</button>)}</div>{filtered.length===0?<div className="empty"><div>📝</div><p>{dayTasks.length?'No tasks match your filters.':'No tasks for this day. Add one above!'}</p></div>:['unscheduled'].map(b=>grouped[b].length?<div className="block" key={b}><div className="block-label">{blockLabels[b]}</div>{grouped[b].map(t=><Task key={t.id} task={t} editing={modal?.id===t.id} onToggle={()=>toggle(t.id)} onDelete={()=>delTask(t.id)} onEdit={()=>setModal(t)} onCancelEdit={()=>setModal(null)} onSaveEdit={u=>{updateTask(t.id,u);setModal(null)}}/>)}</div>:null)}</main></div>{leaveModal&&<LeaveModal selectedDate={selectedDate} today={today} leaveCount={leaveCount} onClose={()=>setLeaveModal(false)} onSave={r=>{addLeave(r);setLeaveModal(false)}}/>}</div>
}
function SyncModal({config,token,dirty,syncing,onClose,onConfig,onToken,onPull,onPush,status}){const[owner,setOwner]=useState(config.owner||DEFAULT_SYNC_CONFIG.owner);const[repo,setRepo]=useState(config.repo||DEFAULT_SYNC_CONFIG.repo);const[path,setPath]=useState(config.path||DEFAULT_SYNC_CONFIG.path);const[branch,setBranch]=useState(config.branch||DEFAULT_SYNC_CONFIG.branch);const settings=()=>({owner:owner.trim()||DEFAULT_SYNC_CONFIG.owner,repo:repo.trim()||DEFAULT_SYNC_CONFIG.repo,path:path.trim()||DEFAULT_SYNC_CONFIG.path,branch:branch.trim()||DEFAULT_SYNC_CONFIG.branch});return <div className="modal-bg" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><h3>☁ Private GitHub Planner Backup</h3><div className="sync-note">Planner data remains local until you choose to back it up. This writes a separate JSON file containing tasks and leave records.</div><div className="fg-row"><div className="fg"><label>GitHub owner / username</label><input value={owner} onChange={e=>setOwner(e.target.value)} placeholder="your-username"/></div><div className="fg"><label>Private repository</label><input value={repo} onChange={e=>setRepo(e.target.value)} placeholder="plansurf-data"/></div></div><div className="fg-row"><div className="fg"><label>Planner data file path</label><input value={path} onChange={e=>setPath(e.target.value)}/></div><div className="fg"><label>Branch</label><input value={branch} onChange={e=>setBranch(e.target.value)}/></div></div><div className="fg"><label>Fine-grained personal access token</label><input type="password" value={token} onChange={e=>onToken(e.target.value)} placeholder="github_pat_..."/><div className="hint">Grant Contents: Read and write for this private repository only. The token is used for this session and never stored.</div></div><div className="sync-note">Status: {status}{dirty?' · local changes need backup':''}</div><div className="sync-actions"><button className="btn ghost" onClick={onClose}>Close</button><button className="btn ghost" disabled={syncing} onClick={()=>{const value=settings();onConfig(value);onPull(value)}}>↓ Pull latest</button><button className="btn primary" disabled={syncing} onClick={()=>{const value=settings();onConfig(value);onPush(value)}}>↑ Save local data</button></div></div></div>}
function Task({task,editing,onToggle,onDelete,onEdit,onCancelEdit,onSaveEdit}){return <div className={`task-wrap ${editing?'is-editing':''}`}><div className={`task ${task.completed?'completed':''}`}><button className={`check ${task.completed?'on':''}`} onClick={onToggle}>{task.completed?'✓':''}</button><div className="body"><div className="title">{task.title}</div><div className="meta"><span className={`pri ${task.priority||'medium'}`}>{task.priority||'medium'}</span>{task.carriedFrom&&<span className="tag">↩ from {task.carriedFrom}</span>}{task.weekendForwarded&&<span className="tag">📅 Monday forward</span>}{task.outstandingForwarded&&<span className="tag">⏭ outstanding</span>}{task.leaveForwarded&&<span className="tag">🏖 leave forward</span>}{task.forwardedTo&&<span className="tag">deferred to {task.forwardedTo}</span>}</div>{task.notes&&<div className="note">{task.notes}</div>}</div><div className="actions"><button title="Edit task" onClick={onEdit}>✎</button><button title="Delete task" onClick={onDelete}>✕</button></div></div>{editing&&<InlineTaskEdit task={task} onCancel={onCancelEdit} onSave={onSaveEdit}/>}</div>}
function CompactTaskAdd({onAdd,onForwardAll,done,total,pct}){const[title,setTitle]=useState('');const[priority,setPriority]=useState('medium');const[notes,setNotes]=useState('');const[showNotes,setShowNotes]=useState(false);const save=e=>{e.preventDefault();if(!title.trim())return;onAdd({title:title.trim(),priority,notes,time:''});setTitle('');setPriority('medium');setNotes('');setShowNotes(false)};return <div className="sticky-workbar"><form className="compact-add" onSubmit={save}><div className="quick-row"><span className="quick-star">✨</span><input aria-label="New task title" value={title} onChange={e=>setTitle(e.target.value)} placeholder="What needs to be done?"/><select aria-label="Priority" value={priority} onChange={e=>setPriority(e.target.value)}><option value="high">🔥 High</option><option value="medium">⚡ Medium</option><option value="low">🌱 Low</option></select><button className="btn primary quick-add-btn">+ Add</button></div><div className="quick-tools"><button type="button" className="text-button" onClick={()=>setShowNotes(!showNotes)}>{showNotes?'▾ Hide notes':'▸ Add notes'}</button><span className="compact-progress"><span style={{width:`${pct}%`}}></span></span><small>{done}/{total} done</small><button type="button" className="text-button" onClick={onForwardAll}>⏭ Forward all</button></div>{showNotes&&<textarea className="quick-notes" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Optional notes, context or reminders..." autoFocus/>}</form></div>}
function InlineTaskEdit({task,onCancel,onSave}){const[title,setTitle]=useState(task.title||'');const[priority,setPriority]=useState(task.priority||'medium');const[notes,setNotes]=useState(task.notes||'');useEffect(()=>{const el=document.getElementById(`edit-${task.id}`);if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'nearest'}),30)},[task.id]);const save=e=>{e.preventDefault();if(title.trim())onSave({title:title.trim(),priority,notes,time:''})};return <form id={`edit-${task.id}`} className="inline-edit" onSubmit={save} onKeyDown={e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))save(e)}}><div className="inline-edit-title"><strong>✏️ Edit task</strong><span>Changes stay right here with the task.</span></div><div className="inline-edit-row"><input value={title} onChange={e=>setTitle(e.target.value)} aria-label="Task title" autoFocus/><select value={priority} onChange={e=>setPriority(e.target.value)} aria-label="Priority"><option value="high">🔥 High</option><option value="medium">⚡ Medium</option><option value="low">🌱 Low</option></select></div><textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Notes..." aria-label="Task notes"/><div className="inline-edit-actions"><button className="btn primary" type="submit">Save changes</button><button className="btn ghost" type="button" onClick={onCancel}>Cancel</button><small>Ctrl/Cmd + Enter saves</small></div></form>}
function LeaveModal({selectedDate,today,leaveCount,onClose,onSave}){const startKey=dateKey(selectedDate);const last=loadLastLeave();const smartType=last?.type || (selectedDate<=today?'sick':'planned');const smartDuration=last?.duration||1;const[start,setStart]=useState(startKey);const[type,setType]=useState(smartType);const[end,setEnd]=useState(addDays(startKey,smartDuration-1));const[returnDate,setReturnDate]=useState(nextBiz(addDays(startKey,smartDuration-1)));const[notes,setNotes]=useState('');useEffect(()=>{if(end&&returnDate<=end)setReturnDate(nextBiz(end))},[end]);const rec={type,start,end,returnDate,notes};const count=start&&end&&returnDate?leaveCount(rec):0;const setOneDay=()=>{setStart(startKey);setEnd(startKey);setReturnDate(nextBiz(startKey))};const setRestWeek=()=>{const d=parseKey(startKey),dow=d.getDay();const fri=new Date(d);fri.setDate(d.getDate()+Math.max(0,5-dow));const e=dateKey(fri);setStart(startKey);setEnd(e);setReturnDate(nextBiz(e))};const save=()=>{if(end<start)return alert('End date must be on or after start date.');if(returnDate<=end)return alert('Return date must be after end date.');onSave(rec)};return <div className="modal-bg" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><h3>Record Leave</h3><div className="quick"><button onClick={()=>{setType('sick');setOneDay()}}>Sick today</button><button onClick={()=>{setType('planned');setOneDay()}}>Planned day</button><button onClick={()=>{setType('planned');setRestWeek()}}>Rest of week</button></div><div className="fg"><label>Leave type</label><select value={type} onChange={e=>setType(e.target.value)}><option value="sick">Sick leave</option><option value="planned">Planned leave</option></select></div><div className="fg"><label>Start date</label><input type="date" value={start} onChange={e=>{setStart(e.target.value);if(end<e.target.value)setEnd(e.target.value);if(returnDate<=e.target.value)setReturnDate(nextBiz(e.target.value))}}/></div><div className="fg"><label>End date</label><input type="date" value={end} onChange={e=>{setEnd(e.target.value);if(returnDate<=e.target.value)setReturnDate(nextBiz(e.target.value))}}/></div><div className="fg"><label>Return / forward tasks to</label><input type="date" value={returnDate} onChange={e=>setReturnDate(e.target.value)}/></div><div className="fg"><label>Notes</label><textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Optional handover or leave notes..."/></div><div className="banner info" style={{marginBottom:0}}><div><strong>Forwarding preview</strong><small>{count} incomplete task{count===1?'':'s'} from the previous business day and leave dates will be copied to {returnDate || 'your return date'}.</small></div></div><div className="ma"><button className="btn ghost" onClick={onClose}>Cancel</button><button className="btn primary" onClick={save}>Save Leave & Forward Tasks</button></div></div></div>}
ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
